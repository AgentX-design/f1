<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>F1 History AI Chatbot</title>
<link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
<header>
  <h1>F1 History AI Chatbot</h1>
  <p>Ask questions about Formula 1 seasons 2021–2025.</p>
</header>
<main>
  <section id="chat" aria-label="Chat conversation"></section>
  <form id="chat-form" aria-label="Send message">
    <input type="text" id="message" placeholder="Ask a question..." aria-required="true" />
    <button type="submit">Send</button>
  </form>
  <section aria-label="Suggested questions">
    <h2>Examples</h2>
    <div id="suggested"></div>
  </section>
</main>
<script src="/static/js/chat.js"></script>
</body>
</html>
